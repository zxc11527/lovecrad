<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c74445">
  <title>兩人一心｜情侶電子集點卡</title>
  <style>
    :root {
      --cream: #fffaf1; --paper: #fffdf9; --ink: #4b302b; --muted: #896c62; --line: #ead7ca;
      --rose: #c74445; --rose-deep: #a73c3c; --rose-soft: #f9dfd8; --peach: #f9e9dc;
      --gold: #eacb84; --gold-ink: #735020;
      --shadow: 0 18px 48px rgba(113, 68, 50, .11), 0 2px 4px rgba(113, 68, 50, .05);
      --radius-xl: 28px; --radius-lg: 20px; --radius-md: 14px;
    }
    * { box-sizing: border-box; } html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: radial-gradient(circle at 4% 0%, rgba(246, 207, 180, .36), transparent 28rem), radial-gradient(circle at 96% 9%, rgba(248, 208, 207, .34), transparent 26rem), var(--cream); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; line-height: 1.5; }
    button, input, textarea { font: inherit; } button { cursor: pointer; } button:disabled { cursor: not-allowed; opacity: .48; } img { max-width: 100%; }
    .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    .topbar { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid rgba(234, 215, 202, .78); background: rgba(255, 253, 249, .86); backdrop-filter: blur(18px); }
    .topbar-inner { height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 850; letter-spacing: -.04em; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 14px; color: white; background: var(--rose); box-shadow: 0 8px 18px rgba(199, 68, 69, .23); font-size: 19px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .save-state { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; color: #4b6c55; background: #dff5e6; font-size: 12px; font-weight: 650; }
    .save-dot { width: 7px; height: 7px; border-radius: 50%; background: #4b9b68; box-shadow: 0 0 6px #4b9b68; }
    .save-state.offline { color: #6c554b; background: #f5eadf; }
    .save-state.offline .save-dot { background: #9b5a4b; box-shadow: none; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; min-height: 42px; padding: 0 17px; border-radius: 12px; color: white; background: var(--rose); font-weight: 780; transition: transform .16s ease, background .16s ease, box-shadow .16s ease; }
    .btn:hover { background: var(--rose-deep); box-shadow: 0 8px 18px rgba(199, 68, 69, .16); } .btn:active { transform: scale(.97); }
    .btn.secondary { color: #7d403a; background: #fff9f1; border-color: #e4c5b6; } .btn.secondary:hover { background: #fbece3; box-shadow: none; }
    .btn.ghost { color: var(--muted); background: transparent; border-color: transparent; } .btn.ghost:hover { color: var(--rose); background: #f9e9df; box-shadow: none; }
    .btn.small { min-height: 34px; padding: 0 11px; border-radius: 10px; font-size: 12px; } .btn.icon { width: 38px; padding: 0; }
    .eyebrow { margin: 0; color: #a44d48; font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .page-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding: 38px 0 24px; }
    h1, h2, h3, p { margin-top: 0; } h1 { margin-bottom: 0; font-size: clamp(28px, 4vw, 43px); line-height: 1.16; letter-spacing: -.06em; } h2 { margin: 8px 0 0; font-size: 22px; line-height: 1.2; letter-spacing: -.045em; } h3 { margin-bottom: 0; font-size: 16px; line-height: 1.3; }
    .members { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; } .avatars { display: flex; padding-left: 5px; } .avatar { display: grid; place-items: center; width: 33px; height: 33px; margin-left: -5px; border: 2px solid var(--paper); border-radius: 50%; color: #813b36; background: #edbcb4; font-size: 12px; font-weight: 850; } .avatar:nth-child(2) { color: #76531c; background: #f2d28a; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, .75fr); gap: 24px; }
    .card { border: 1px solid var(--line); border-radius: var(--radius-xl); background: rgba(255, 253, 249, .93); box-shadow: var(--shadow); }
    .stamp-card { position: relative; overflow: hidden; padding: 26px; background: linear-gradient(135deg, #f9ddd5 0%, #f7e0cd 50%, #f8c6c4 100%); } .stamp-card.has-background { background-size: cover; background-position: center; } .stamp-card.has-background::before { content: ""; position: absolute; inset: 0; background: rgba(255, 248, 239, .78); } .stamp-card > * { position: relative; }
    .stamp-orbit { position: absolute; right: -49px; top: -52px; width: 170px; height: 170px; border: 20px solid rgba(255, 247, 233, .62); border-radius: 50%; }
    .card-head, .section-head { display: flex; align-items: start; justify-content: space-between; gap: 16px; } .card-head h2 { font-size: clamp(23px, 3vw, 32px); }
    .stamp-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
    .stamp-slot { display: grid; place-items: center; aspect-ratio: 1; border: 1.5px dashed rgba(160, 105, 90, .52); border-radius: 15px; background: rgba(255, 250, 244, .42); }
    .stamp-slot.filled { border-style: solid; border-color: rgba(181, 75, 68, .35); background: rgba(255, 235, 227, .76); }
    .stamp-heart { color: #b74c45; font-size: clamp(22px, 3vw, 31px); line-height: 1; } .stamp-image { width: 54%; height: 54%; object-fit: contain; }
    .progress-row { display: flex; align-items: end; gap: 18px; margin-top: 25px; } .progress-count { min-width: 86px; } .progress-count small, .progress-meta { display: block; color: #865e54; font-size: 11px; } .progress-count strong { display: block; margin-top: 2px; color: #51312c; font-size: 21px; }
    .progress-track { flex: 1; margin-bottom: 4px; } .track { height: 8px; overflow: hidden; border-radius: 999px; background: rgba(255, 250, 244, .75); } .track > span { display: block; height: 100%; width: 0; border-radius: inherit; background: #b94d46; transition: width .25s ease; } .progress-meta { margin-top: 7px; text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    .card-actions { display: flex; gap: 9px; margin-top: 21px; } .card-actions .btn:first-child { flex: 1; }
    .tip-input { width: 100%; margin-top: 16px; border: 1px solid rgba(218, 170, 156, .74); border-radius: 10px; padding: 10px 12px; color: var(--ink); background: rgba(255, 251, 246, .72); outline: none; } .tip-input:focus, .field input:focus, .field textarea:focus { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(199, 68, 69, .11); }
    .paper { padding: 25px; } .section-icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; color: #ae4b43; background: #f8e0d7; font-size: 20px; }
    .next-gift { margin-top: 24px; padding: 17px; border-radius: 16px; background: #fff3e8; } .gift-line { display: flex; justify-content: space-between; gap: 12px; } .gift-note { margin: 5px 0 0; color: var(--muted); font-size: 12px; } .cost { display: inline-flex; align-items: center; height: fit-content; padding: 5px 9px; border-radius: 999px; color: var(--gold-ink); background: #f2d89e; font-size: 11px; font-weight: 850; white-space: nowrap; }
    .next-copy { margin: 15px 0 0; color: var(--muted); font-size: 13px; } .next-copy strong { color: #a6433c; } .full { width: 100%; margin-top: 17px; }
    .sync-note { display: flex; align-items: center; gap: 8px; margin: 20px 0 0; padding-top: 17px; border-top: 1px solid #efe0d5; color: var(--muted); font-size: 11px; }
    .split-row { margin-top: 24px; } .gift-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; } .gift-item { padding: 15px; border: 1px solid #efded2; border-radius: 16px; background: #fffdf9; } .gift-item .gift-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px; color: #ae4b43; background: #f8e4d7; } .gift-item-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; } .gift-item .gift-note { min-height: 18px; } .gift-controls { display: flex; align-items: center; gap: 3px; margin-top: 13px; } .gift-controls .btn:first-child { margin-right: auto; }
    .history-list { margin-top: 20px; } .history-item { display: flex; gap: 10px; padding-bottom: 16px; } .history-marker { position: relative; display: grid; flex: 0 0 31px; place-items: center; width: 31px; height: 31px; border-radius: 50%; color: #ae4b43; background: #f7ded7; font-size: 13px; } .history-item:not(:last-child) .history-marker::after { content: ""; position: absolute; left: 50%; top: 34px; width: 1px; height: 18px; background: #ead8cb; } .history-item.redeem .history-marker { color: #80601d; background: #f2dfad; } .history-text { min-width: 0; padding-top: 1px; } .history-text p { margin: 0; color: #60423a; font-size: 13px; } .history-text small { display: block; margin-top: 3px; color: #977b70; font-size: 10px; }
    .recent { display: flex; align-items: center; gap: 12px; margin-top: 24px; padding: 15px 20px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255, 249, 241, .72); color: var(--muted); font-size: 12px; } .recent strong { color: var(--ink); } .recent-pills { display: flex; gap: 7px; overflow-x: auto; white-space: nowrap; } .recent-pill { padding: 5px 10px; border-radius: 999px; background: #f2e2d3; }
    .bottom-space { height: 30px; } .empty { padding: 28px 10px; border: 1px dashed #dfc5b5; border-radius: 15px; color: var(--muted); text-align: center; font-size: 13px; }
    .mobile-nav { display: none; } .modal-wrap { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: 18px; background: rgba(62, 35, 29, .32); } .modal-wrap.open { display: grid; } .modal { width: min(480px, 100%); max-height: min(700px, 92vh); overflow: auto; padding: 24px; border: 1px solid var(--line); border-radius: 24px; background: var(--paper); box-shadow: 0 24px 70px rgba(62, 35, 29, .24); } .modal-head { display: flex; justify-content: space-between; gap: 15px; } .modal-head h2 { margin: 0; } .field { margin-top: 17px; } .field label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 780; } .field input, .field textarea { width: 100%; border: 1px solid #e5d2c5; border-radius: 11px; padding: 11px 12px; color: var(--ink); background: #fffdfa; outline: none; } .field textarea { min-height: 90px; resize: vertical; } .field-help { margin: 6px 0 0; color: var(--muted); font-size: 11px; }
    .upload-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 17px; } .upload-box { position: relative; padding: 14px; border: 1px dashed #d6ad9e; border-radius: 14px; color: #815047; background: #fff7ef; text-align: left; } .upload-box:hover { background: #ffede1; } .upload-box input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; } .upload-box strong { display: block; margin-top: 6px; font-size: 13px; } .upload-box span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; } .modal-foot { display: flex; justify-content: end; gap: 8px; margin-top: 24px; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 80; transform: translateY(18px); opacity: 0; pointer-events: none; padding: 12px 15px; border: 1px solid #e7cbbb; border-radius: 13px; color: #65443b; background: #fff9f2; box-shadow: var(--shadow); font-size: 13px; transition: opacity .18s ease, transform .18s ease; } .toast.show { transform: translateY(0); opacity: 1; }
    @media (max-width: 820px) { .shell { width: min(100% - 28px, 600px); } .topbar-inner { height: 62px; } .save-state { display: none; } .page-head { padding: 26px 0 19px; } .page-head h1 { font-size: 29px; } .grid { grid-template-columns: 1fr; gap: 16px; } .stamp-card, .paper { padding: 18px; } .stamp-grid { gap: 8px; margin-top: 21px; } .stamp-slot { border-radius: 11px; } .card-actions { margin-top: 17px; } .gift-list { grid-template-columns: 1fr; } .split-row { margin-top: 16px; } .recent { margin-bottom: 66px; } .mobile-nav { position: fixed; left: 14px; right: 14px; bottom: 14px; z-index: 30; display: flex; padding: 5px; border: 1px solid var(--line); border-radius: 17px; background: rgba(255, 253, 249, .95); box-shadow: 0 14px 36px rgba(75, 48, 43, .13); backdrop-filter: blur(12px); } .mobile-nav button { flex: 1; border: 0; border-radius: 12px; padding: 8px 5px; color: var(--muted); background: transparent; font-size: 10px; font-weight: 750; } .mobile-nav button.active { color: var(--rose); background: #fae9df; } .mobile-nav-icon { display: block; margin-bottom: 2px; font-size: 15px; } }
    @media (max-width: 430px) { .top-actions .btn { padding: 0 10px; font-size: 12px; } .page-head { align-items: start; flex-direction: column; gap: 12px; } .members { align-self: end; } .progress-row { gap: 10px; } .progress-count { min-width: 74px; } .progress-count strong { font-size: 18px; } .upload-grid { grid-template-columns: 1fr; } .modal { padding: 20px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <div class="brand"><span class="brand-mark">♥</span><span>兩人一心</span></div>
      <div class="top-actions">
        <span id="syncStatus" class="save-state offline"><span class="save-dot"></span>連線中...</span>
        <button class="btn secondary small" id="openSettings">⚙ 自訂</button>
        <button class="btn small" id="openGift">＋ 新增禮物</button>
      </div>
    </div>
  </header>

  <main id="app" class="shell">
    <section class="page-head">
      <div>
        <p class="eyebrow">YOUR LITTLE KEEPSAKE</p>
        <h1>今天也一起集點吧。</h1>
      </div>
      <div class="members"><div class="avatars"><span class="avatar">你</span><span class="avatar">愛</span></div><span>你們的專屬卡片</span></div>
    </section>

    <section id="cardSection" class="grid nav-section">
      <article id="stampCard" class="card stamp-card">
        <span class="stamp-orbit"></span>
        <div class="card-head">
          <div><p class="eyebrow">STAMP CARD / 01</p><h2 id="cardTitle">我們的小約定</h2></div>
          <button class="btn secondary icon" id="openSettingsIcon" aria-label="編輯卡片">✎</button>
        </div>
        <div id="stampGrid" class="stamp-grid" aria-label="集點格"></div>
        <div class="progress-row">
          <div class="progress-count"><small>目前進度</small><strong><span id="currentCount">00</span> <small style="display:inline; font-size:12px">/ <span id="totalCount">10</span> 枚</small></strong></div>
          <div class="progress-track"><div class="track"><span id="progressBar"></span></div><span id="progressMeta" class="progress-meta">0% COLLECTED</span></div>
        </div>
        <input id="stampNote" class="tip-input" maxlength="90" placeholder="這次的小約定（選填，例如：完成一起散步）">
        <div class="card-actions"><button class="btn" id="addStamp">♥ 集一枚</button><button class="btn secondary" id="removeStamp">− 撤銷</button></div>
      </article>

      <article id="rewardSection" class="card paper nav-section">
        <div class="section-head"><div><p class="eyebrow">NEXT LITTLE JOY</p><h2>下一個小獎勵</h2></div><span class="section-icon">🎁</span></div>
        <div id="nextGift"></div>
        <div class="sync-note">♡ <span id="syncText">等待雲端資料同步中...</span></div>
      </article>
    </section>

    <section class="grid split-row">
      <article id="giftSection" class="card paper nav-section">
        <div class="section-head"><div><p class="eyebrow">REWARD MENU</p><h2>想一起兌換什麼？</h2></div><button class="btn small" id="openGiftInline">＋ 新增</button></div>
        <div id="giftList" class="gift-list"></div>
      </article>
      <article id="historySection" class="card paper nav-section">
        <div class="section-head"><div><p class="eyebrow">SHARED HISTORY</p><h2>我們的更新</h2></div><span class="section-icon">◷</span></div>
        <div id="historyList" class="history-list"></div>
      </article>
    </section>
    <div id="recentBar" class="recent"><strong>最近兌換</strong><div id="recentPills" class="recent-pills"></div></div>
    <div class="bottom-space"></div>
  </main>

  <nav class="mobile-nav" aria-label="頁面導覽"><button class="active" data-target="cardSection"><span class="mobile-nav-icon">♥</span>卡片</button><button data-target="rewardSection"><span class="mobile-nav-icon">🎁</span>兌換</button><button data-target="historySection"><span class="mobile-nav-icon">◷</span>紀錄</button></nav>

  <div id="settingsModal" class="modal-wrap" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head"><div><p class="eyebrow">MAKE IT YOURS</p><h2 id="settingsTitle">自訂我們的集點卡</h2></div><button class="btn ghost icon close-modal" data-close="settingsModal" aria-label="關閉">×</button></div>
      <div class="field"><label for="settingsTitleInput">卡片名稱</label><input id="settingsTitleInput" maxlength="40" placeholder="例如：我們的週末約會"></div>
      <div class="field"><label for="settingsTotalInput">集滿需要幾枚印章？</label><input id="settingsTotalInput" type="number" min="4" max="40"><p class="field-help">可設定 4–40 枚；如果減少格數，現有點數會自動調整到上限。</p></div>
      <div class="upload-grid">
        <label class="upload-box">▧<strong>上傳卡片底圖</strong><span>自動壓縮，無容量限制</span><input id="backgroundUpload" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
        <label class="upload-box">✦<strong>上傳多款集章圖案</strong><span>可按住選取多張圖案</span><input id="stampUpload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple></label>
      </div>
      <div class="modal-foot"><button class="btn secondary close-modal" data-close="settingsModal">取消</button><button class="btn" id="saveSettings">儲存設定</button></div>
    </div>
  </div>

  <div id="giftModal" class="modal-wrap" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head"><div><p class="eyebrow">A LITTLE WISH</p><h2 id="giftTitleModal">新增兌換禮物</h2></div><button class="btn ghost icon close-modal" data-close="giftModal" aria-label="關閉">×</button></div>
      <form id="giftForm">
        <div class="field"><label for="giftNameInput">禮物／約定名稱</label><input id="giftNameInput" required maxlength="60" placeholder="例如：一起吃甜點"></div>
        <div class="field"><label for="giftCostInput">需要幾點？</label><input id="giftCostInput" required type="number" min="1" max="99" placeholder="8"></div>
        <div class="field"><label for="giftNoteInput">小提醒 <span style="color:var(--muted); font-weight:400">（選填）</span></label><textarea id="giftNoteInput" maxlength="180" placeholder="例如：挑一個不趕時間的週末下午"></textarea></div>
        <div class="modal-foot"><button type="button" class="btn secondary close-modal" data-close="giftModal">取消</button><button type="submit" class="btn" id="saveGift">加入兌換清單</button></div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <!-- 引入 Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ==========================================
    // ⚠️ 務必把下方內容替換成你的 Firebase 金鑰！⚠️
    // ==========================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdefg"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const cardDocRef = doc(db, "reward-cards", "couple-card-01"); 

    const $ = id => document.getElementById(id);
    let editingGiftId = null;
    let toastTimer = null;
    let isConnected = false;
    
    let state = {
      title: "我們的小約定", total: 10, current: 0, background: "", stampImages: [],
      gifts: [{ id: "g1", title: "一起吃甜點", note: "挑一個不趕時間的週末下午", cost: 8 }],
      history: [], redemptions: []
    };

    function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    function escapeHTML(value) { return String(value ?? "").replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char])); }
    function formatDate(value) { const date = new Date(value); if (Number.isNaN(date.getTime())) return "剛剛"; return new Intl.DateTimeFormat("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }).format(date); }
    
    function showToast(message, danger = false) {
      const toast = $("toast"); toast.textContent = message; toast.style.color = danger ? "#9e3d38" : "#65443b";
      toast.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    async function saveState() {
      if (!isConnected) { alert("尚未連線到雲端資料庫！\n請確認你的 firebaseConfig 有設定正確，且網路正常。"); return false; }
      try {
        await setDoc(cardDocRef, state);
        return true;
      } catch (error) {
        console.error(error);
        alert("資料儲存失敗！\n錯誤代碼：" + error.message);
        return false;
      }
    }

    // 監聽 Firebase (加入錯誤 Alert 提示)
    onSnapshot(cardDocRef, (docSnap) => {
      if (docSnap.exists()) {
        state = Object.assign(state, docSnap.data());
      } else {
        setDoc(cardDocRef, state);
      }
      isConnected = true;
      $("syncStatus").classList.remove("offline");
      $("syncStatus").innerHTML = '<span class="save-dot"></span>已連線雲端同步';
      $("syncText").textContent = "資料已透過雲端即時同步，彼此都會馬上看到更新。";
      render();
    }, (error) => {
      console.error("Firebase 連線錯誤:", error);
      alert("❌ 無法連上雲端資料庫！\n\n原因：" + error.message + "\n\n👉 解決方式：\n1. 檢查原始碼 210 行的 firebaseConfig 是否有填上你的金鑰\n2. 若有開啟擋廣告軟體 (AdBlock) 或 Brave 瀏覽器，請暫時關閉或用無痕視窗測試。");
      $("syncStatus").classList.add("offline");
      $("syncStatus").innerHTML = '<span class="save-dot"></span>離線模式';
      $("syncText").textContent = "無法連線至雲端，請檢查設定檔或網路。";
    });

    function render() {
      $("cardTitle").textContent = state.title || "我們的小約定";
      $("currentCount").textContent = String(state.current).padStart(2, "0");
      $("totalCount").textContent = String(state.total).padStart(2, "0");
      const percent = Math.round((state.current / state.total) * 100);
      $("progressBar").style.width = percent + "%";
      $("progressMeta").textContent = percent + "% COLLECTED";
      
      const stampCard = $("stampCard");
      stampCard.classList.toggle("has-background", Boolean(state.background));
      stampCard.style.backgroundImage = state.background ? "url('" + state.background + "')" : "";
      
      $("stampGrid").innerHTML = Array.from({ length: state.total }, (_, index) => {
        const filled = index < state.current;
        let content = '<span style="width:6px;height:6px;border-radius:50%;background:rgba(189,130,117,.45)"></span>';
        if (filled) {
          if (state.stampImages && state.stampImages.length > 0) {
            const imgSrc = state.stampImages[index % state.stampImages.length]; 
            content = '<img class="stamp-image" src="' + escapeHTML(imgSrc) + '" alt="印章">';
          } else {
            content = '<span class="stamp-heart">♥</span>';
          }
        }
        return '<div class="stamp-slot ' + (filled ? "filled" : "") + '">' + content + "</div>";
      }).join("");
      
      renderNextGift(); renderGifts(); renderHistory(); renderRecent();
      $("removeStamp").disabled = state.current <= 0;
      $("addStamp").disabled = state.current >= state.total;
    }

    function renderNextGift() {
      const gifts = state.gifts.slice().sort((a, b) => a.cost - b.cost); const next = gifts.find(gift => gift.cost > state.current) || gifts[0]; const container = $("nextGift");
      if (!next) { container.innerHTML = '<div class="empty" style="margin-top:22px">還沒有兌換禮物。<br>替你們設定一份期待吧。</div>'; return; }
      const remaining = Math.max(0, next.cost - state.current);
      container.innerHTML = '<div class="next-gift"><div class="gift-line"><div><h3>' + escapeHTML(next.title) + '</h3>' + (next.note ? '<p class="gift-note">' + escapeHTML(next.note) + '</p>' : '') + '</div><span class="cost">' + next.cost + ' 點</span></div></div><p class="next-copy">' + (remaining ? '再集 <strong>' + remaining + ' 枚</strong>，就能解鎖這份小心意。' : '你們已經集滿，現在就可以兌換囉。') + '</p><button class="btn full" data-redeem="' + escapeHTML(next.id) + '" ' + (state.current < next.cost ? "disabled" : "") + '>' + (state.current < next.cost ? "還差 " + remaining + " 枚" : "現在兌換") + '</button>';
    }
    
    function renderGifts() {
      const list = $("giftList"); if (!state.gifts.length) { list.innerHTML = '<div class="empty" style="grid-column:1/-1">設定一份期待，為每一次集章多一點期待。</div>'; return; }
      list.innerHTML = state.gifts.map(gift => '<article class="gift-item"><div class="gift-item-head"><span class="gift-icon">🎁</span><span class="cost">' + gift.cost + ' 點</span></div><h3 style="margin-top:12px">' + escapeHTML(gift.title) + '</h3><p class="gift-note">' + escapeHTML(gift.note || "") + '</p><div class="gift-controls"><button class="btn small" data-redeem="' + escapeHTML(gift.id) + '" ' + (state.current < gift.cost ? "disabled" : "") + '>兌換</button><button class="btn ghost small" data-edit="' + escapeHTML(gift.id) + '">✎</button><button class="btn ghost small" data-delete="' + escapeHTML(gift.id) + '" aria-label="移除">×</button></div></article>').join("");
    }
    
    function renderHistory() {
      const list = $("historyList"); const items = state.history.slice(0, 8); if (!items.length) { list.innerHTML = '<p class="empty">第一枚集章，從今天的小約定開始。</p>'; return; }
      list.innerHTML = items.map(item => { const redeem = item.type === "redeem"; return '<div class="history-item ' + (redeem ? "redeem" : "") + '"><span class="history-marker">' + (redeem ? "🎁" : "♥") + '</span><div class="history-text"><p><strong>' + (redeem ? "你們" : "你") + '</strong> ' + escapeHTML(item.note) + '</p><small>' + formatDate(item.at) + (item.delta ? " " + (item.delta > 0 ? "+" : "") + item.delta + " 點" : "") + '</small></div></div>'; }).join("");
    }
    
    function renderRecent() {
      const pills = $("recentPills"); if (!state.redemptions.length) { pills.innerHTML = '<span class="recent-pill">還沒有兌換紀錄</span>'; return; }
      pills.innerHTML = state.redemptions.slice(0, 5).map(item => '<span class="recent-pill">' + escapeHTML(item.title) + ' −' + item.cost + '</span>').join("");
    }

    function openModal(id) { $(id).classList.add("open"); } function closeModal(id) { $(id).classList.remove("open"); }
    function fillSettings() { $("settingsTitleInput").value = state.title; $("settingsTotalInput").value = state.total; }
    function openGiftModal(gift) { editingGiftId = gift ? gift.id : null; $("giftTitleModal").textContent = gift ? "編輯兌換禮物" : "新增兌換禮物"; $("giftNameInput").value = gift ? gift.title : ""; $("giftCostInput").value = gift ? gift.cost : 5; $("giftNoteInput").value = gift ? gift.note || "" : ""; $("saveGift").textContent = gift ? "儲存變更" : "加入兌換清單"; openModal("giftModal"); setTimeout(() => $("giftNameInput").focus(), 30); }
    function addHistory(type, delta, note) { state.history.unshift({ id: uid("h"), type, delta, note, at: new Date().toISOString() }); if (state.history.length > 50) state.history.length = 50; }

    function changeStamp(direction) {
      const next = direction === "add" ? Math.min(state.total, state.current + 1) : Math.max(0, state.current - 1);
      if (next === state.current) return;
      const delta = next - state.current; state.current = next;
      const note = $("stampNote").value.trim() || (delta > 0 ? "集了一點小美好" : "撤銷了一枚集章");
      addHistory(delta > 0 ? "add" : "remove", delta, note); $("stampNote").value = "";
      saveState(); showToast(delta > 0 ? "已集一枚，同步中..." : "已撤銷一枚集章。 ");
    }

    function redeem(id) {
      const gift = state.gifts.find(item => item.id === id); if (!gift) return;
      if (state.current < gift.cost) { showToast("集章還不夠，再累積一些小美好吧。", true); return; }
      if (!window.confirm("確定要兌換「" + gift.title + "」嗎？會使用 " + gift.cost + " 點。")) return;
      state.current -= gift.cost; addHistory("redeem", -gift.cost, "兌換了「" + gift.title + "」");
      state.redemptions.unshift({ id: uid("r"), title: gift.title, cost: gift.cost, at: new Date().toISOString() });
      saveState(); showToast("已兌換「" + gift.title + "」！");
    }

    // Canvas 壓縮功能
    function compressImage(file, maxWidth, maxHeight, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = event => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width; let height = img.height;
            if (width > maxWidth || height > maxHeight) {
              const ratio = Math.min(maxWidth / width, maxHeight / height);
              width *= ratio; height *= ratio;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/webp', quality));
          };
          img.onerror = error => reject(error);
        };
        reader.onerror = error => reject(error);
      });
    }

    async function readBgImage(file) {
      if (!file) return; showToast("圖片處理中，請稍後...");
      try {
        state.background = await compressImage(file, 1000, 1000, 0.6);
        saveState(); showToast("底圖已更新且壓縮完成！");
      } catch (e) { showToast("圖片壓縮失敗", true); }
    }

    async function readMultipleStamps(files) {
      if (!files || files.length === 0) return; showToast("印章壓縮處理中...");
      try {
        const fileArray = Array.from(files);
        const compressPromises = fileArray.map(file => compressImage(file, 250, 250, 0.8));
        state.stampImages = await Promise.all(compressPromises);
        saveState(); showToast(`成功載入並壓縮 ${state.stampImages.length} 款印章！`);
      } catch (e) { showToast("印章圖片處理失敗", true); }
    }

    $("addStamp").addEventListener("click", () => changeStamp("add"));
    $("removeStamp").addEventListener("click", () => changeStamp("remove"));
    $("openSettings").addEventListener("click", () => { fillSettings(); openModal("settingsModal"); });
    $("openSettingsIcon").addEventListener("click", () => { fillSettings(); openModal("settingsModal"); });
    $("openGift").addEventListener("click", () => openGiftModal());
    $("openGiftInline").addEventListener("click", () => openGiftModal());
    $("backgroundUpload").addEventListener("change", event => readBgImage(event.target.files[0]));
    $("stampUpload").addEventListener("change", event => readMultipleStamps(event.target.files));
    
    $("saveSettings").addEventListener("click", () => {
      const title = $("settingsTitleInput").value.trim(); const total = Number($("settingsTotalInput").value);
      if (!title) { showToast("請輸入卡片名稱。", true); return; }
      if (!Number.isInteger(total) || total < 4 || total > 40) { showToast("集點格數請設定為 4–40 枚。", true); return; }
      state.title = title; state.total = total; state.current = Math.min(state.current, total);
      saveState(); closeModal("settingsModal"); showToast("卡片設定已更新。 ");
    });
    
    $("giftForm").addEventListener("submit", event => {
      event.preventDefault(); const title = $("giftNameInput").value.trim(); const cost = Number($("giftCostInput").value); const note = $("giftNoteInput").value.trim();
      if (!title || !Number.isInteger(cost) || cost < 1 || cost > 99) { showToast("請填寫禮物名稱與正確的兌換點數。", true); return; }
      if (editingGiftId) { const gift = state.gifts.find(item => item.id === editingGiftId); if (gift) Object.assign(gift, { title, cost, note }); } 
      else { state.gifts.push({ id: uid("g"), title, cost, note }); }
      saveState(); closeModal("giftModal"); showToast("兌換禮物已更新。");
    });
    
    document.addEventListener("click", event => {
      const redeemBtn = event.target.closest("[data-redeem]"); const editBtn = event.target.closest("[data-edit]"); const deleteBtn = event.target.closest("[data-delete]"); const closeBtn = event.target.closest("[data-close]");
      if (redeemBtn) redeem(redeemBtn.getAttribute("data-redeem"));
      if (editBtn) openGiftModal(state.gifts.find(item => item.id === editBtn.getAttribute("data-edit")));
      if (deleteBtn) { const gift = state.gifts.find(item => item.id === deleteBtn.getAttribute("data-delete")); if (gift && window.confirm("確定要移除「" + gift.title + "」嗎？")) { state.gifts = state.gifts.filter(item => item.id !== gift.id); saveState(); } }
      if (closeBtn) closeModal(closeBtn.getAttribute("data-close"));
      if (event.target.classList.contains("modal-wrap")) closeModal(event.target.id);
    });
    
    document.addEventListener("keydown", event => { if (event.key === "Escape") { closeModal("settingsModal"); closeModal("giftModal"); } });
    document.querySelectorAll(".mobile-nav button").forEach(button => button.addEventListener("click", () => { document.getElementById(button.dataset.target).scrollIntoView({ behavior: "smooth", block: "start" }); document.querySelectorAll(".mobile-nav button").forEach(item => item.classList.remove("active")); button.classList.add("active"); }));
  </script>
</body>
</html>
